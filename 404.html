<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>页面未找到 · 粒子维度 附属Wiki</title>
    <meta name="robots" content="noindex">
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%2305050a'/%3E%3Ctext x='32' y='33' text-anchor='middle' dominant-baseline='central' font-family='Arial, Helvetica, sans-serif' font-size='34' font-weight='700' letter-spacing='-2' fill='%2360a5fa'%3E404%3C/text%3E%3C/svg%3E">
    <style>
        :root {
            --bg-deep: #0a0a14;
            --text-primary: #e8e8f0;
            --text-secondary: #b0b0c8;
            --accent-cyan: #5eeadb;
            --accent-purple: #a78bfa;
            --accent-blue: #60a5fa;
        }

        *,
        *::before,
        *::after {
            box-sizing: border-box;
        }

        html {
            font-size: 15px;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        body {
            margin: 0;
            min-height: 100vh;
            min-height: 100svh;
            display: grid;
            place-items: center;
            padding: 32px 20px;
            color: var(--text-primary);
            background:
                radial-gradient(1100px 620px at 12% -12%, rgba(96, 165, 250, 0.16), transparent 62%),
                radial-gradient(900px 520px at 92% 112%, rgba(167, 139, 250, 0.16), transparent 62%),
                var(--bg-deep);
            font-family: -apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', 'Noto Sans SC', 'Helvetica Neue', Arial, sans-serif;
            line-height: 1.6;
            letter-spacing: 0.02em;
            overflow-x: hidden;
        }

        #starfield {
            position: fixed;
            inset: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            pointer-events: none;
        }

        .shell {
            position: relative;
            z-index: 1;
            width: 100%;
            max-width: 640px;
            text-align: center;
            padding: 52px 44px 44px;
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 24px;
            background: rgba(16, 16, 30, 0.55);
            box-shadow:
                0 24px 80px rgba(0, 0, 0, 0.45),
                inset 0 1px 0 rgba(255, 255, 255, 0.06);
            backdrop-filter: blur(18px);
            -webkit-backdrop-filter: blur(18px);
        }

        .brand {
            margin: 0 0 28px;
            font-size: 0.75rem;
            font-weight: 600;
            letter-spacing: 0.28em;
            text-transform: uppercase;
            color: rgba(176, 176, 200, 0.75);
        }

        .code {
            margin: 0;
            font-size: clamp(52px, 11vw, 84px);
            font-weight: 800;
            line-height: 1;
            letter-spacing: 0.06em;
            background: linear-gradient(120deg, var(--accent-cyan), var(--accent-blue) 48%, var(--accent-purple));
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            filter: drop-shadow(0 0 20px rgba(94, 234, 219, 0.16));
            user-select: none;
        }

        h1 {
            margin: 18px 0 10px;
            font-size: 1.35rem;
            font-weight: 700;
            letter-spacing: 0.06em;
        }

        .desc {
            margin: 0 auto;
            max-width: 34em;
            font-size: 0.92rem;
            color: var(--text-secondary);
        }

        .actions {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 12px;
            margin-top: 30px;
        }

        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            padding: 11px 22px;
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 12px;
            background: rgba(255, 255, 255, 0.04);
            color: var(--text-primary);
            font: inherit;
            font-size: 0.9rem;
            text-decoration: none;
            cursor: pointer;
            transition: transform 0.25s cubic-bezier(0.4, 0, 0.2, 1),
                        border-color 0.25s ease,
                        background 0.25s ease,
                        box-shadow 0.25s ease;
        }

        .btn:hover {
            transform: translateY(-2px);
            border-color: rgba(94, 234, 219, 0.45);
            background: rgba(94, 234, 219, 0.08);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.35);
        }

        .btn:focus-visible {
            outline: 2px solid var(--accent-cyan);
            outline-offset: 3px;
        }

        .btn-primary {
            border-color: transparent;
            background: linear-gradient(120deg, var(--accent-cyan), var(--accent-blue));
            color: #06121a;
            font-weight: 700;
        }

        .btn-primary:hover {
            background: linear-gradient(120deg, var(--accent-cyan), var(--accent-blue));
            box-shadow: 0 12px 34px rgba(94, 234, 219, 0.25);
        }

        .hint {
            margin: 26px 0 0;
            font-size: 0.72rem;
            color: rgba(176, 176, 200, 0.5);
            letter-spacing: 0.04em;
            word-break: break-all;
        }

        @media (max-width: 520px) {
            .shell {
                padding: 40px 22px 34px;
                border-radius: 20px;
            }

            .actions {
                flex-direction: column;
            }

            .btn {
                width: 100%;
            }
        }

        @media (prefers-reduced-motion: reduce) {
            .btn,
            .code {
                transition: none;
                animation: none;
            }

            .btn:hover {
                transform: none;
            }
        }
    </style>
</head>
<body>
    <canvas id="starfield" aria-hidden="true"></canvas>

    <main class="shell">
        <p class="brand">粒子维度 附属Wiki</p>
        <p class="code" aria-hidden="true">404</p>
        <h1>这个页面不存在</h1>
        <p class="desc">
            链接可能已经失效，或者地址拼错了。<br>
            可以回到首页继续查找。
        </p>
        <div class="actions">
            <a class="btn btn-primary" href="/">返回首页</a>
            <button class="btn" type="button" id="back" hidden>返回上一页</button>
        </div>
        <p class="hint" id="hint"></p>
    </main>

    <script>
        (function () {
            'use strict';

            var reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
            var canvas = document.getElementById('starfield');
            var ctx = canvas.getContext('2d');
            var colors = ['94, 234, 219', '167, 139, 250', '96, 165, 250'];
            var particles = [];
            var width = 0;
            var height = 0;
            var rafId = 0;

            function resize() {
                var dpr = Math.min(window.devicePixelRatio || 1, 2);
                width = window.innerWidth;
                height = window.innerHeight;
                canvas.width = Math.floor(width * dpr);
                canvas.height = Math.floor(height * dpr);
                canvas.style.width = width + 'px';
                canvas.style.height = height + 'px';
                ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
                seed();
            }

            function seed() {
                var count = Math.max(28, Math.min(64, Math.round(width / 26)));
                particles = [];
                for (var i = 0; i < count; i += 1) {
                    particles.push({
                        x: Math.random() * width,
                        y: Math.random() * height,
                        r: 0.8 + Math.random() * 1.8,
                        alpha: 0.15 + Math.random() * 0.45,
                        vx: (Math.random() - 0.5) * 0.16,
                        vy: (Math.random() - 0.5) * 0.16,
                        color: colors[Math.floor(Math.random() * colors.length)]
                    });
                }
            }

            function draw() {
                ctx.clearRect(0, 0, width, height);
                for (var i = 0; i < particles.length; i += 1) {
                    var p = particles[i];
                    ctx.beginPath();
                    ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
                    ctx.fillStyle = 'rgba(' + p.color + ', ' + p.alpha + ')';
                    ctx.fill();
                }
            }

            function step() {
                for (var i = 0; i < particles.length; i += 1) {
                    var p = particles[i];
                    p.x += p.vx;
                    p.y += p.vy;
                    if (p.x < -6) p.x = width + 6;
                    if (p.x > width + 6) p.x = -6;
                    if (p.y < -6) p.y = height + 6;
                    if (p.y > height + 6) p.y = -6;
                }
                draw();
                rafId = window.requestAnimationFrame(step);
            }

            function start() {
                if (rafId) return;
                if (reduceMotion) {
                    draw();
                    return;
                }
                rafId = window.requestAnimationFrame(step);
            }

            function stop() {
                if (!rafId) return;
                window.cancelAnimationFrame(rafId);
                rafId = 0;
            }

            resize();
            start();

            window.addEventListener('resize', function () {
                resize();
                draw();
            });

            document.addEventListener('visibilitychange', function () {
                if (document.hidden) {
                    stop();
                } else {
                    start();
                }
            });

            var back = document.getElementById('back');
            var sameOriginReferrer = false;
            try {
                sameOriginReferrer = Boolean(document.referrer) &&
                    new URL(document.referrer).origin === window.location.origin;
            } catch (error) {
                sameOriginReferrer = false;
            }

            if (window.history.length > 1 && sameOriginReferrer) {
                back.hidden = false;
                back.addEventListener('click', function () {
                    window.history.back();
                });
            }

            var hint = document.getElementById('hint');
            var path = window.location.pathname + window.location.search;
            if (path !== '/' && path !== '/404.html') {
                hint.textContent = '请求路径：' + path;
            }
        }());
    </script>
</body>
</html>
